<!doctype html>
<!--
  og:image 模板（1200×630）。重新產生：npm run og
-->
<html lang="zh-Hant-TW" data-lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@900&family=Newsreader:opsz,wght@6..72,400&family=IBM+Plex+Mono:wght@400;500&display=block">
<link rel="stylesheet" href="../../public/styles.css">
<style>
	html, body { width: 1200px; height: 630px; overflow: hidden; }
	body::before { display: none; }
	.og { position: relative; width: 1200px; height: 630px; padding: 72px 80px; display: grid; align-content: space-between; }
	.og > :not(canvas) { position: relative; }
	.og__title { font-family: "Noto Serif TC", serif; font-weight: 900; font-size: 168px; line-height: 1; letter-spacing: 0.06em; }
	.og__en { margin-top: 20px; font-family: "Newsreader", serif; font-size: 46px; letter-spacing: -0.01em; }
	.og__url { font-family: var(--font-mono); font-size: 24px; letter-spacing: 0.06em; color: var(--ink-2); }
	.og .seal--lg { position: absolute; right: 80px; bottom: 72px; }
</style>
</head>
<body>
<div class="og">
	<canvas class="topo" data-topo="hero"></canvas>
	<p class="kicker" style="font-size:20px">Software · Data · Information services</p>
	<div>
		<h1 class="og__title">覓谷資訊</h1>
		<p class="og__en">MeetGood Information Co., Ltd.</p>
	</div>
	<p class="og__url">meetgood.ericshih.net</p>
	<span class="seal seal--lg"><span>覓</span><span>谷</span></span>
</div>
<script src="../../public/site.js"></script>
</body>
</html>
